name: Pages

# Builds the website from site/ and examples/ (every example model is rebuilt
# from its committed model.py) and deploys it to GitHub Pages.
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-cad.lock
      - name: Create the CAD environment
        run: |
          python -m venv .venv-cad
          .venv-cad/bin/pip install -r requirements-cad.lock
      - name: Build the site
        run: .venv-cad/bin/python scripts/build_site.py --out _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
