name: Release

# Push a tag vX.Y.Z (matching VERSION), or run this workflow by hand on main,
# to build the package, publish it to PyPI and create a GitHub release (the
# manual run creates the vX.Y.Z tag from VERSION).
# One-time setup on pypi.org: add a "trusted publisher" for this repository
# (owner YUI-TIEN, repo img2cad, workflow release.yml, environment pypi).
# No API token is stored anywhere.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Tag must match VERSION
        if: github.event_name == 'push'
        run: test "v$(cat VERSION)" = "${GITHUB_REF_NAME}"
      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build
      - name: Smoke-test the wheel
        run: |
          python -m venv /tmp/check
          /tmp/check/bin/pip install dist/*.whl
          /tmp/check/bin/img2cad version
          /tmp/check/bin/img2cad doctor
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create the release with notes from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(cat VERSION)"
          awk -v v="## $version" '$0==v{on=1;next} /^## /{on=0} on' CHANGELOG.md > notes.md
          gh release create "v$version" dist/* --target "$GITHUB_SHA" --title "img2cad $version" --notes-file notes.md
