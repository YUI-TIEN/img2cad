  }

  const t = document.createElement("div"); t.className = `toast glass ${kind}`; t.textContent = text; $("toasts").append(t);
  setTimeout(() => { t.style.transition = "opacity .4s, transform .4s"; t.style.opacity = 0; t.style.transform = "translateY(6px)"; setTimeout(() => t.remove(), 450); }, kind === "error" ? 6000 : 2600);
}
const fmt = v => (Math.abs(v) >= 100 ? v.toFixed(1) : v.toFixed(2));

// ---------- camera views (CAD is Z-up; three.js is Y-up) ----------
function setView(name, animate = true) {
  const d = { front: [0, -1, 0], right: [1, 0, 0], top: [0, 0, 1], iso: [1, -1, 0.8] }[name];
  const dir = new THREE.Vector3(d[0], d[2], -d[1]).normalize();
  const target = center.clone().addScaledVector(dir, size * 1.7);
  const up = name === "top" ? new THREE.Vector3(0, 0, -1) : new THREE.Vector3(0, 1, 0);
  if (!animate) { camera.position.copy(target); camera.up.copy(up); controls.target.copy(center); controls.update(); return; }
  const from = camera.position.clone(), fromTarget = controls.target.clone(), t0 = performance.now();
  camera.up.copy(up);
  (function step(now) {
    const k = Math.min(1, (now - t0) / 520), e = 1 - Math.pow(1 - k, 3);
    camera.position.lerpVectors(from, target, e); controls.target.lerpVectors(fromTarget, center, e); controls.update();
    if (k < 1) requestAnimationFrame(step);
  })(t0);
}

// ---------- loading ----------
async function load(file, { keepView = false, version = "" } = {}) {
  current = file;
  statusEl.textContent = `Loading ${file.name}…`;
  const url = `/api/file?id=${encodeURIComponent(file.id)}&v=${version}`;
  let object;
  try {
    if (file.format === "stl") {
      const g = await new STLLoader().loadAsync(url);
      object = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color: 0xc8cdd4 })); object.name = file.name;
    } else if (file.format === "3mf") {
      object = await new ThreeMFLoader().loadAsync(url);
    } else {
      const response = await fetch(url);
      if (!response.ok) throw new Error(await response.text());
      object = (await new GLTFLoader().parseAsync(await response.arrayBuffer(), "")).scene;
    }
  } catch (error) { statusEl.textContent = "Could not load"; toast(String(error.message || error), "error"); return false; }
  if (model) { scene.remove(model); model.traverse(o => { o.geometry?.dispose(); o.material?.dispose?.(); }); }
  if (file.format !== "glb") object.rotation.x = -Math.PI / 2;   // STL/3MF are Z-up mm
  else object.scale.setScalar(1000);                              // glTF is metres, Y-up
  model = object; scene.add(model);
  const box = new THREE.Box3().setFromObject(model); box.getCenter(center); size = box.getSize(new THREE.Vector3()).length() || 1;
  camera.near = size / 1000; camera.far = size * 100; camera.updateProjectionMatrix();
  key.position.copy(center).add(new THREE.Vector3(size * 0.6, size * 1.8, size * 0.7)); key.target.position.copy(center);
  const cam = key.shadow.camera; cam.left = cam.bottom = -size; cam.right = cam.top = size; cam.near = size / 100; cam.far = size * 6; cam.updateProjectionMatrix();
  floor.scale.setScalar(size * 6); floor.position.set(center.x, box.min.y - size * 0.002, center.z);
  rim.position.copy(center).add(new THREE.Vector3(-size, size * 0.4, -size));
  meshes = [];
  model.traverse(o => { if (o.isMesh) {
    const m = new THREE.MeshPhysicalMaterial({ color: o.material.color ?? 0xcccccc, roughness: 0.42, metalness: 0, clearcoat: 0.35, clearcoatRoughness: 0.35, side: THREE.DoubleSide });
    o.material = m; o.castShadow = true; meshes.push(o);
  } });
  const groups = new Map();
  meshes.forEach(o => { const n = partName(o).replace(/_\d+$/, ""); if (!groups.has(n)) groups.set(n, []); groups.get(n).push(o); });
  const hidden = new Set(parts.filter(p => p.hidden).map(p => p.name));
  parts = [...groups].map(([name, list]) => ({ name, meshes: list, hidden: hidden.has(name) }));
  parts.forEach(p => p.meshes.forEach(m => (m.visible = !p.hidden)));
  selected = null; renderLayers(); applyClip(); renderInspect();
  if (!keepView) setView("iso", false);
  else {  // keep the viewing angle, refit the distance to the new size
    const dir = camera.position.clone().sub(controls.target).normalize();
    controls.target.copy(center); camera.position.copy(center).addScaledVector(dir, size * 1.7); controls.update();
  }
  const s = box.getSize(new THREE.Vector3());
  statusEl.textContent = `${parts.length} part${parts.length === 1 ? "" : "s"} · ${fmt(s.x)} × ${fmt(s.z)} × ${fmt(s.y)} mm`;
  return true;
}
function partName(mesh) { let o = mesh; while (o && !o.name) o = o.parent; return (o && o.name) || "part"; }

// ---------- layers ----------
const eyeOn = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const eyeOff = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 3l18 18M10.6 5.1A10 10 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4M6.6 6.6C3.8 8.4 2 12 2 12s3.6 7 10 7a9.6 9.6 0 0 0 5.4-1.6"/></svg>';
function renderLayers() {
  const host = $("layer-list"); host.innerHTML = "";
  $("layer-count").textContent = parts.length;
  parts.forEach(part => {
    const row = document.createElement("div"); row.className = "layer" + (part.hidden ? " off" : "") + (part === selected ? " sel" : "");
    const sw = document.createElement("span"); sw.className = "swatch"; sw.style.background = "#" + part.meshes[0].material.color.getHexString(THREE.SRGBColorSpace);
    const name = document.createElement("span"); name.className = "name"; name.textContent = part.name;
    const eye = document.createElement("button"); eye.className = "eye"; eye.innerHTML = part.hidden ? eyeOff : eyeOn; eye.title = "Show / hide";
    eye.onclick = e => { e.stopPropagation(); part.hidden = !part.hidden; part.meshes.forEach(m => (m.visible = !part.hidden)); renderLayers(); };
    row.onclick = () => select(part === selected ? null : part);
    row.onmouseenter = () => highlight(part, 0.18); row.onmouseleave = () => highlight(part, part === selected ? 0.35 : 0);
    row.append(sw, name, eye); host.append(row);
  });
}
function highlight(part, k) { part?.meshes.forEach(m => { m.material.emissive.setHex(0x0a84ff); m.material.emissiveIntensity = k; }); }
function select(part) {
  if (selected) highlight(selected, 0);
  selected = part; if (part) highlight(part, 0.35);
  renderLayers(); renderInspect(); if (part) showTab("inspect");
}
const partOf = mesh => parts.find(p => p.meshes.includes(mesh));

// ---------- inspect ----------
let lastMeasure = null;
function renderInspect() {
  const host = $("tab-inspect");
  const rows = [];
  if (model) { const s = new THREE.Box3().setFromObject(model).getSize(new THREE.Vector3()); rows.push(["Model", `${fmt(s.x)} × ${fmt(s.z)} × ${fmt(s.y)}`]); }
  if (selected) {
    const b = new THREE.Box3(); selected.meshes.forEach(m => b.expandByObject(m)); const s = b.getSize(new THREE.Vector3());
    rows.push(["Part", selected.name], ["Colour", "#" + selected.meshes[0].material.color.getHexString(THREE.SRGBColorSpace)], ["Size X", fmt(s.x)], ["Size Y", fmt(s.z)], ["Size Z", fmt(s.y)]);
  }
  if (lastMeasure) rows.push(["Distance", fmt(lastMeasure.d)], ["ΔX", fmt(lastMeasure.dx)], ["ΔY", fmt(lastMeasure.dy)], ["ΔZ", fmt(lastMeasure.dz)]);
  host.innerHTML = `<dl class="kv">${rows.map(([k, v]) => `<dt>${k}</dt><dd>${String(v).replace(/</g, "&lt;")}</dd>`).join("")}</dl>
    <p class="hint">${measuring ? "Measuring: click two points on the model." : "Click a part to inspect it. <kbd>M</kbd> measures between two points. All sizes in mm (X × Y × Z, Z up)."}</p>`;
}

// ---------- picking & measuring ----------
const ray = new THREE.Raycaster(), pointer = new THREE.Vector2();
let down = null;
renderer.domElement.addEventListener("pointerdown", e => { down = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener("pointerup", e => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 4) return;
  pointer.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(pointer, camera);
  const hit = ray.intersectObjects(meshes.filter(m => m.visible), false)[0];
  if (!measuring) { select(hit ? partOf(hit.object) : null); return; }
  if (!hit) return;
  picks.push(hit.point.clone());
  const dot = new THREE.Mesh(new THREE.SphereGeometry(size / 260, 20, 12), new THREE.MeshBasicMaterial({ color: 0x0a84ff, depthTest: false }));
  dot.renderOrder = 10; dot.position.copy(hit.point); scene.add(dot); markers.push(dot);
  if (picks.length === 2) {
    const [a, b] = picks, d = b.clone().sub(a);
    const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints([a, b]), new THREE.LineBasicMaterial({ color: 0x0a84ff, depthTest: false }));
    line.renderOrder = 10; scene.add(line); markers.push(line);
    lastMeasure = { d: a.distanceTo(b), dx: Math.abs(d.x), dy: Math.abs(d.z), dz: Math.abs(d.y) };
    picks = []; renderInspect(); showTab("inspect"); toast(`${fmt(lastMeasure.d)} mm`);
  }
});
function setMeasure(on) {
  measuring = on; $("t-measure").classList.toggle("on", on); picks = [];
  markers.forEach(m => scene.remove(m)); markers = []; if (!on) lastMeasure = null;
  renderInspect(); if (on) showTab("inspect");
}

// ---------- tools ----------
document.querySelectorAll("[data-view]").forEach(b => (b.onclick = () => setView(b.dataset.view)));
$("t-measure").onclick = () => setMeasure(!measuring);
$("t-wire").onclick = () => { const on = !$("t-wire").classList.contains("on"); $("t-wire").classList.toggle("on", on); meshes.forEach(m => (m.material.wireframe = on)); };
$("t-fit").onclick = () => setView("iso");
$("t-shot").onclick = () => { const a = document.createElement("a"); a.href = renderer.domElement.toDataURL("image/png"); a.download = `${current?.name || "img2cad"}.png`; a.click(); toast("Screenshot saved"); };
$("t-section").onclick = () => { const open = !$("section").classList.contains("open"); $("section").classList.toggle("open", open); $("t-section").classList.toggle("on", open); };
$("t-panels").onclick = togglePanels;
function togglePanels() { const hide = !$("layers").classList.contains("hidden"); $("layers").classList.toggle("hidden", hide); $("props").classList.toggle("hidden", hide); $("t-panels").classList.toggle("on", hide); }

// segmented controls with a sliding thumb
function segmented(host, onPick, initial = 0) {
  const buttons = [...host.querySelectorAll("button")], thumb = host.querySelector(".thumb");
  const pick = i => {
    const b = buttons[i]; thumb.style.width = b.offsetWidth + "px"; thumb.style.transform = `translateX(${b.offsetLeft - 2}px)`;
    buttons.forEach((x, j) => x.setAttribute("aria-selected", i === j)); onPick(b, i);
  };
  buttons.forEach((b, i) => (b.onclick = () => pick(i)));
  requestAnimationFrame(() => pick(initial));
  return pick;
}
let clipAxis = "";
const pickAxis = segmented($("clip-axis"), b => { clipAxis = b.dataset.axis; applyClip(); });
function applyClip() {
  const t = +$("clip-pos").value;
  $("clip-pos").style.setProperty("--fill", t * 100 + "%");
  meshes.forEach(m => { m.material.clippingPlanes = clipAxis ? [clipPlane] : []; m.material.needsUpdate = true; });
  if (!clipAxis || !model) return;
  const box = new THREE.Box3().setFromObject(model);
  const range = { x: [box.min.x, box.max.x], y: [-box.max.z, -box.min.z], z: [box.min.y, box.max.y] }[clipAxis];
  clipPlane.normal.set(...{ x: [1, 0, 0], y: [0, 0, -1], z: [0, 1, 0] }[clipAxis]);
  clipPlane.constant = -(range[0] + (range[1] - range[0]) * t);
}
$("clip-pos").oninput = applyClip;

const tabNames = ["params", "inspect"];
const pickTab = segmented($("tabs"), b => {
  const tab = b.dataset.tab;
  $("tab-params").hidden = tab !== "params"; $("tab-inspect").hidden = tab !== "inspect";
  $("params-foot").hidden = tab !== "params" || !current?.editable;
});
const showTab = name => pickTab(tabNames.indexOf(name));

// ---------- parameters ----------
async function loadParams() {
  const host = $("tab-params");
  params = []; values = {}; saved = {};
  if (!current?.editable) {
    host.innerHTML = `<p class="empty">Open a <code>model.py</code> to edit its parameters:<br><code>img2cad view model.py</code><br><br>Parameters are module-level UPPERCASE numbers. Add <code># [min, max] label</code> after one to set its range.</p>`;
    $("params-foot").hidden = true; return;
  }
  const data = await (await fetch(`/api/params?id=${current.id}`)).json();
  if (data.error) { host.innerHTML = `<p class="empty">${data.error.replace(/</g, "&lt;")}</p>`; return; }
  params = data.params;
  params.forEach(p => { values[p.name] = p.value; saved[p.name] = p.saved ?? p.value; });
  if (!params.length) { host.innerHTML = `<p class="empty">No parameters found. Name inputs in UPPERCASE at the top of <code>model.py</code>, e.g. <code>HEIGHT = 68.4  # [40, 90] height</code>, or mark any assignment with <code># [min, max]</code> or <code># @param</code>.</p>`; }
  else renderParams();
  $("params-foot").hidden = $("tab-params").hidden;
  setDirty();
}
function renderParams() {
  const host = $("tab-params"); host.innerHTML = "";
  params.forEach(p => {
    const row = document.createElement("div"); row.className = "param"; row.dataset.name = p.name;
    const label = document.createElement("div"); label.className = "label";
    label.innerHTML = `${p.name.toLowerCase().replace(/_/g, " ")}${p.label ? `<small>${p.label.replace(/</g, "&lt;")}</small>` : ""}`;
    label.title = "Drag to change · Shift ×10 · Alt ÷10";
    if (p.kind === "bool") {  // a switch, not a slider
      const toggle = document.createElement("input"); toggle.type = "checkbox"; toggle.className = "switch";
      const showBool = v => { toggle.checked = !!v; row.classList.toggle("changed", v !== saved[p.name]); };
      toggle.onchange = () => { values[p.name] = toggle.checked ? 1 : 0; showBool(values[p.name]); setDirty(); scheduleBuild(); };
      showBool(values[p.name]);
      row.append(label, toggle); host.append(row);
      return;
    }
    const field = document.createElement("input"); field.className = "field"; field.inputMode = "decimal"; field.spellcheck = false;
    const slider = document.createElement("input"); slider.type = "range"; slider.className = "slider";
    slider.min = p.min; slider.max = p.max; slider.step = p.step;
    const show = v => {
      field.value = p.integer ? String(Math.round(v)) : (+v).toFixed(Math.max(0, -Math.floor(Math.log10(p.step))));
      slider.value = v; slider.style.setProperty("--fill", ((v - p.min) / (p.max - p.min || 1)) * 100 + "%");
      row.classList.toggle("changed", Math.abs(v - saved[p.name]) > 1e-12);
    };
    const set = v => { if (!Number.isFinite(v)) return; if (p.integer) v = Math.round(v); values[p.name] = v; show(v); setDirty(); scheduleBuild(); };
    show(values[p.name]);
    slider.oninput = () => set(+slider.value);
    field.onkeydown = e => {
      if (e.key === "Enter") { field.blur(); }
      else if (e.key === "Escape") { show(values[p.name]); field.blur(); }
      else if (e.key === "ArrowUp" || e.key === "ArrowDown") { e.preventDefault(); const k = (e.shiftKey ? 10 : e.altKey ? 0.1 : 1) * p.step * (e.key === "ArrowUp" ? 1 : -1); set(values[p.name] + k); }
    };
    field.onchange = () => { try { set(Function(`"use strict";return (${field.value.replace(/[^-+*/().\d\se]/g, "")})`)()); } catch { show(values[p.name]); } };  // accepts arithmetic like 12*2
    // Figma-style scrubbing on the label
    label.onpointerdown = e => {
      label.setPointerCapture(e.pointerId); const x0 = e.clientX, v0 = values[p.name];
      const span = (p.max - p.min) || Math.abs(v0) || 1;
      document.body.style.cursor = "ew-resize";
      label.onpointermove = m => { const scale = m.shiftKey ? 10 : m.altKey ? 0.1 : 1; set(v0 + ((m.clientX - x0) / 240) * span * scale); };
      label.onpointerup = () => { label.onpointermove = null; document.body.style.cursor = ""; };
    };
    row.append(label, field, slider); host.append(row);
  });
}
function changed() { return params.filter(p => Math.abs(values[p.name] - saved[p.name]) > 1e-12); }
function setDirty() {
  const dirty = changed().length > 0;
  $("topbar").classList.toggle("dirty", dirty); $("save").disabled = !dirty; $("reset").disabled = !dirty;
}
let buildTimer = null, building = false, queued = false;
function scheduleBuild(force = false) {
  if (!$("live").checked && !force) { buildState("Live rebuild is off · press ↵ Rebuild", false); return; }
  clearTimeout(buildTimer); buildTimer = setTimeout(rebuild, force ? 0 : 450);
}
function buildState(text, busy, error = false) {
  $("build-state").classList.toggle("building", busy); $("build-state").classList.toggle("error", error); $("build-text").textContent = text;
}
async function rebuild() {
  if (building) { queued = true; return; }
  building = true; buildState("Rebuilding…", true);
  const t0 = performance.now();
  try {
    const r = await (await fetch("/api/rebuild", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id: current.id, values }) })).json();
    if (!r.ok) { buildState(r.error, false, true); toast("Build failed: " + r.error, "error"); }
    else { await load(current, { keepView: true, version: r.version }); buildState(`Rebuilt in ${((performance.now() - t0) / 1000).toFixed(1)} s`, false); }
  } catch (error) { buildState(String(error), false, true); }
  building = false; if (queued) { queued = false; rebuild(); }
}
$("save").onclick = async () => {
  const r = await (await fetch("/api/save", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id: current.id, values }) })).json();
  if (!r.ok) { toast(r.error, "error"); return; }
  params.forEach(p => (saved[p.name] = values[p.name])); renderParams(); setDirty();
  toast(`Saved to ${current.name} · backup ${current.name}.bak`);
};
$("reset").onclick = async () => {
  params.forEach(p => (values[p.name] = saved[p.name])); renderParams(); setDirty();
  buildState("Restoring…", true);
  const r = await (await fetch("/api/reset", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id: current.id }) })).json();
  if (r.ok) { await load(current, { keepView: true, version: r.version }); buildState("Up to date", false); }
};
$("live").onchange = () => { if ($("live").checked && changed().length) scheduleBuild(true); };

// ---------- keyboard ----------
addEventListener("keydown", e => {
  if (e.target.matches("input, select, textarea") && e.key !== "Escape") return;
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "s") { e.preventDefault(); if (!$("save").disabled) $("save").click(); return; }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k in { 1: 0, 2: 0, 3: 0, 4: 0 }) setView(["front", "right", "top", "iso"][+k - 1]);
  else if (k === "m") setMeasure(!measuring);
  else if (k === "s") $("t-section").click();
  else if (k === "w") $("t-wire").click();
  else if (k === "f") setView("iso");
  else if (k === "enter" && !$("live").checked) scheduleBuild(true);
  else if (e.key === "Tab") { e.preventDefault(); togglePanels(); }
  else if (e.key === "Escape") { setMeasure(false); select(null); $("section").classList.remove("open"); $("t-section").classList.remove("on"); }
});

// ---------- start ----------
files = await (await fetch("/api/files")).json();
const picker = $("file");
files.forEach(f => picker.append(new Option(f.name, f.id)));
const wanted = new URLSearchParams(location.search).get("file");
if (wanted && files.some(f => f.id === wanted)) picker.value = wanted;
picker.onchange = async () => {
  history.replaceState(null, "", `?file=${picker.value}`);
  const f = files.find(x => x.id === picker.value); await load(f); await loadParams();
};
if (files.length) { const f = files.find(x => x.id === picker.value) || files[0]; await load(f); await loadParams(); }
else statusEl.textContent = "No files";
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
// For automated checks (tests and the MCP server's screenshots).
window.img2cadViewer = { get meshes() { return meshes; }, get parts() { return parts; }, clipPlane, setView, get params() { return params; }, get values() { return values; }, rebuild };
</script>
</body>
